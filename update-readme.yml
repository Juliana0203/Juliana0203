name: Update README

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC = 6:00 a.m. en Bogotá
  workflow_dispatch:        # permite ejecutarlo manualmente

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar README
        run: python update_readme.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit y push (con tu identidad para que cuente en el streak)
        env:
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          USER_ID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/users/$OWNER" | jq -r '.id')
          git config user.name "$OWNER"
          git config user.email "${USER_ID}+${OWNER}@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "docs: actualizar README automáticamente"
          git push
